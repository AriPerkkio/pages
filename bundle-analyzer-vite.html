<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Treemap</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --tooltip-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --tooltip-bg: #242423;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --tooltip-bg: #242423;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-1);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 650; }
  header .total { color: var(--text-secondary); }
  .seg {
    display: inline-flex;
    border: 1px solid var(--hairline);
    border-radius: 7px;
    overflow: hidden;
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font: inherit;
    padding: 4px 12px;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--hairline); }
  .seg button[aria-pressed="true"] {
    background: var(--page);
    color: var(--text-primary);
    font-weight: 600;
  }
  #search {
    font: inherit;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--hairline);
    border-radius: 7px;
    padding: 4px 10px;
    width: 200px;
  }
  #search::placeholder { color: var(--text-muted); }
  #matchcount { color: var(--text-muted); min-width: 90px; }
  #legend { display: flex; gap: 14px; align-items: center; margin-left: auto; }
  #legend .item { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  #legend .chip { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  #crumbs {
    padding: 6px 14px;
    background: var(--surface-1);
    border-bottom: 1px solid var(--hairline);
    color: var(--text-muted);
    white-space: nowrap;
    overflow-x: auto;
  }
  #crumbs a { color: var(--text-secondary); text-decoration: none; cursor: pointer; }
  #crumbs a:hover { text-decoration: underline; }
  #crumbs .cur { color: var(--text-primary); font-weight: 600; }
  #crumbs .hint { float: right; color: var(--text-muted); }
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--tooltip-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    padding: 8px 10px;
    max-width: 380px;
    display: none;
    z-index: 10;
  }
  #tooltip .tname { font-weight: 650; word-break: break-all; }
  #tooltip .tpath { color: var(--text-muted); font-size: 12px; word-break: break-all; margin-bottom: 4px; }
  #tooltip table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #tooltip td { padding: 1px 0; }
  #tooltip td:first-child { color: var(--text-secondary); padding-right: 14px; }
  #tooltip td:last-child { text-align: right; }
  #tablepanel {
    position: absolute;
    inset: 0;
    overflow: auto;
    background: var(--surface-1);
    display: none;
    z-index: 5;
    padding: 8px 14px 20px;
  }
  #tablepanel table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #tablepanel th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--hairline);
    padding: 6px 16px 6px 0;
    position: sticky; top: 0;
    background: var(--surface-1);
  }
  #tablepanel td { padding: 4px 16px 4px 0; border-bottom: 1px solid var(--hairline); }
  #tablepanel td.num, #tablepanel th.num { text-align: right; }
  #tablepanel td.path { word-break: break-all; }
  #tablepanel .note { color: var(--text-muted); padding: 8px 0; }
</style>
</head>

<header>
  <h1 id="title">package</h1>

    <button id="btn-table" aria-pressed="false">Table</button>
  </span>
  <input id="search" type="search" placeholder="Find file or folder…" aria-label="Search">
  <span id="matchcount"></span>
  <span id="legend"></span>
</header>
<div id="crumbs"></div>
<div id="stage">
  <canvas id="map"></canvas>
  <div id="tooltip" role="status"></div>
  <div id="tablepanel"></div>
</div>

    }
    if (!deeper) return n;
    n = deeper;
  }
}

const tooltip = document.getElementById('tooltip');
function showTooltip(node, ex, ey) {
  const rows = [
    ['Raw size', fmt(node.v)],
    ['Gzip size', fmt(node.g)],
    ['% of ' + DATA.n, pct(node[metric], DATA[metric])],
  ];
  if (node.parent && node.parent !== DATA) {
    rows.push(['% of ' + node.parent.n, pct(node[metric], node.parent[metric])]);
  }
  if (node.c) rows.unshift(['Files', String(countMatches(node, ''))]);
  tooltip.innerHTML =
    '<div class="tname"></div><div class="tpath"></div><table>' +
    rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') +
    '</table>';
  tooltip.querySelector('.tname').textContent = node.n;
  tooltip.querySelector('.tpath').textContent = pathOf(node);
  tooltip.style.display = 'block';
  const stage = document.getElementById('stage');
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let tx = ex + 14, ty = ey + 14;
  if (tx + tw > stage.clientWidth - 6) tx = ex - tw - 14;
  if (ty + th > stage.clientHeight - 6) ty = ey - th - 14;
  tooltip.style.left = Math.max(4, tx) + 'px';
  tooltip.style.top = Math.max(4, ty) + 'px';
}

let raf = 0;
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const n = nodeAt(px, py);
  if (n !== hovered) {
    hovered = n;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(draw);
  }
  if (n && n !== currentRoot) showTooltip(n, px, py);
  else tooltip.style.display = 'none';
});
canvas.addEventListener('mouseleave', () => {
  hovered = null;
  tooltip.style.display = 'none';
  requestAnimationFrame(draw);
});
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const n = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
  if (!n || n === currentRoot) return;
  // zoom one level: the child of currentRoot that contains the click
  let target = n;
  while (target.parent && target.parent !== currentRoot) target = target.parent;
  if (!target.c) return; // a bare file at this level — nothing to zoom into
  currentRoot = target;
  hovered = null;
  tooltip.style.display = 'none';
  renderChrome(); relayout(); renderTable();
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (currentRoot.parent) {
    currentRoot = currentRoot.parent;
    hovered = null;
    tooltip.style.display = 'none';
    renderChrome(); relayout(); renderTable();
  }
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && currentRoot !== DATA) {
    currentRoot = DATA;
    hovered = null;
    renderChrome(); relayout(); renderTable();
  }
});

/* ---------- controls ---------- */
function setMetric(m) {
  metric = m;
  document.getElementById('btn-raw').setAttribute('aria-pressed', String(m === 'v'));
  document.getElementById('btn-gzip').setAttribute('aria-pressed', String(m === 'g'));
  renderChrome(); relayout(); renderTable();
}
document.getElementById('btn-raw').onclick = () => setMetric('v');
document.getElementById('btn-gzip').onclick = () => setMetric('g');

function setView(table) {
  tableMode = table;
  document.getElementById('btn-map').setAttribute('aria-pressed', String(!table));
  document.getElementById('btn-table').setAttribute('aria-pressed', String(table));
  document.getElementById('tablepanel').style.display = table ? 'block' : 'none';
  if (table) renderTable();
}
document.getElementById('btn-map').onclick = () => setView(false);
document.getElementById('btn-table').onclick = () => setView(true);

const TABLE_LIMIT = 300;
function renderTable() {
  if (!tableMode) return;
  const leaves = [];
  (function collect(n) {
    if (n.c) n.c.forEach(collect);
    else leaves.push(n);
  })(currentRoot);
  leaves.sort((a, b) => b[metric] - a[metric]);
  const shown = leaves.slice(0, TABLE_LIMIT);
  const panel = document.getElementById('tablepanel');
  const rows = shown.map(n =>
    '<tr><td class="path">' + escapeHtml(pathOf(n)) + '</td>' +
    '<td class="num">' + fmt(n.v) + '</td>' +
    '<td class="num">' + fmt(n.g) + '</td>' +
    '<td class="num">' + pct(n[metric], currentRoot[metric]) + '</td></tr>'
  ).join('');
  panel.innerHTML =
    '<p class="note">Largest files under <strong>' + escapeHtml(pathOf(currentRoot)) + '</strong>, by ' +
    (metric === 'v' ? 'raw' : 'gzip') + ' size' +
    (leaves.length > TABLE_LIMIT ? ' — showing ' + TABLE_LIMIT + ' of ' + leaves.length : '') +
    '</p><table><thead><tr><th>File</th><th class="num">Raw</th><th class="num">Gzip</th>' +
    '<th class="num">% of ' + escapeHtml(currentRoot.n) + '</th></tr></thead><tbody>' + rows + '</tbody></table>';
}
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  const mc = document.getElementById('matchcount');
  if (query) {
    markMatches(DATA, query);
    mc.textContent = countMatches(DATA, query) + ' files match';
  } else {
    mc.textContent = '';
  }
  draw();
});

/* ---------- boot / theme reactivity ---------- */
function refreshTheme() { readTheme(); renderChrome(); draw(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('resize', () => { relayout(); });

document.getElementById('title').textContent = DATA.n;
readTheme();
renderChrome();
relayout();
</script>
</body>
</html>
